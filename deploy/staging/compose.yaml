name: mahjong-crew-staging
services:
  app:
    image: ${MAHJ_STAGING_IMAGE:?Set the immutable staging image tag in the deployment environment}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    pids_limit: 128
    labels:
      traefik.enable: "false"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    networks: [staging]
networks:
  staging:
    internal: true
